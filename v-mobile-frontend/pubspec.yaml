name: v_mobile_frontend
description: "MVP мобильного мессенджера для курсового проекта."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_contacts:
    path: packages/flutter_contacts
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.0
  google_fonts: ^6.3.1
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  mime: ^2.0.0
  video_player: ^2.9.5
  web_socket_channel: ^3.0.3
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
